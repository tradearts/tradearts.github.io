name: Validate static site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate links, metadata and export fixes
        run: python scripts/validate_site.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Confirm generated fixes are current
        run: |
          python scripts/normalize_site.py
          git diff --exit-code
